
name: Build MoZx APK

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Inspect MoZx source ZIP
        run: |
          echo "Checking uploaded ZIP..."
          unzip -t MoZx-Android-Source.zip
          echo "ZIP file list:"
          unzip -Z1 MoZx-Android-Source.zip | head -100
          
